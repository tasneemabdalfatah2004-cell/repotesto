{% extends 'base.html' %}

{% block title %}الملف الشخصي{% endblock %}

{% block content %}

<!-- ================= PROFILE HEADER ================= -->
<section class="profile-header">
    <div class="profile-avatar">
        <img src="{{ url_for('static', filename=client['avatar'] if client['avatar'] else 'img/profile.webp') }}"
             alt="{{ client['username'] }}">
    </div>

    <h2 class="profile-name">{{ client['username'] }}</h2>

    {% if client['location'] %}
        <p class="profile-location">📍 {{ client['location'] }}</p>
    {% endif %}
</section>

<!-- ================= PROFILE CONTENT ================= -->
<section class="profile-content">

    <!-- ===== ABOUT ===== -->
    <div class="profile-box">
        <h3>نبذة عني</h3>
        <p>
            {{ client['bio'] if client['bio'] else 'لم يتم إضافة نبذة بعد.' }}
        </p>
    </div>

</section>

{% endblock %}
