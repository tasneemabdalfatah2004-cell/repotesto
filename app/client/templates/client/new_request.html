{% extends 'base.html' %}

{% block title %}طلب تصميم{% endblock %}

{% block content %}
<div class="request-wrapper">

    <!-- البطاقة -->
    <div class="request-container">

        <!-- العنوان -->
        <div class="request-header">
            <h2>طلب تصميم جديد</h2>
            <p>قدّم تفاصيل واضحة لمساعدة المصمم على فهم رؤيتك بدقة</p>
        </div>

        <!-- النموذج -->
        <form method="POST" class="request-form">

            <div class="form-group">
                <label for="description">وصف الطلب</label>
                <textarea
                    id="description"
                    name="description"
                    placeholder="مثال: أحتاج شعار بسيط بألوان هادئة يعبر عن الإبداع..."
                    required
                ></textarea>
            </div>

            <input type="hidden" name="design_id" value="{{ design_id }}">
            <input type="hidden" name="designer_id" value="{{ designer_id }}">

            <div class="form-actions">
                <button type="submit" class="btn-submit">
                    إرسال الطلب
                </button>
            </div>

        </form>

    </div>
</div>

<style>
/* ===== الصفحة ===== */
.request-wrapper {
    min-height: 80vh;
    background: #f8f9fa;
    padding: 40px 15px;
    font-family: 'Segoe UI', Tahoma, sans-serif;
}

/* ===== الرجوع ===== */
.top-nav {
    max-width: 720px;
    margin: 0 auto 15px auto;
}

.back-link {
    color: #2c3e50;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
}

.back-link:hover {
    text-decoration: underline;
}

/* ===== البطاقة ===== */
.request-container {
    max-width: 720px;
    margin: auto;
    background: #ffffff;
    border-radius: 12px;
    padding: 30px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.06);
}

/* ===== العنوان ===== */
.request-header {
    margin-bottom: 25px;
}

.request-header h2 {
    margin: 0 0 8px;
    color: #1e272e;
}

.request-header p {
    margin: 0;
    color: #6c757d;
    font-size: 15px;
}

/* ===== الفورم ===== */
.request-form .form-group {
    display: flex;
    flex-direction: column;
    margin-bottom: 20px;
}

.request-form label {
    font-weight: 600;
    margin-bottom: 6px;
    color: #333;
}

.request-form textarea {
    min-height: 160px;
    padding: 14px;
    font-size: 15px;
    border-radius: 8px;
    border: 1px solid #dcdcdc;
    resize: vertical;
}

.request-form textarea:focus {
    outline: none;
    border-color: #2ecc71;
}

/* ===== الأزرار ===== */
.form-actions {
    text-align: right;
}

.btn-submit {
    background: #2ecc71;
    color: #fff;
    padding: 12px 28px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.btn-submit:hover {
    background: #27ae60;
}
</style>
{% endblock %}
