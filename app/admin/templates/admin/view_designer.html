{% extends "base.html" %}

{% block content %}

<style>

/* الصفحة */

.container{
max-width:1200px;
margin:auto;
padding:30px;
}

/* عنوان الصفحة */

.page-title{
font-size:26px;
font-weight:bold;
margin-bottom:20px;
}

/* معلومات المصمم */

.designer-info{
background:#f5f5f5;
padding:15px;
border-radius:8px;
margin-bottom:30px;
}

/* شبكة التصاميم */

.design-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:20px;
}

/* بطاقة التصميم */

.design-card{
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 4px 10px rgba(0,0,0,0.08);
transition:0.3s;
}

.design-card:hover{
transform:translateY(-5px);
box-shadow:0 8px 20px rgba(0,0,0,0.15);
}

/* صورة التصميم */

.design-image{
width:100%;
height:200px;
object-fit:cover;
}

/* جسم البطاقة */

.design-body{
padding:15px;
text-align:center;
}

/* عنوان التصميم */

.design-title{
font-size:16px;
font-weight:bold;
margin-bottom:10px;
}

/* زر الحذف */

.delete-btn{
display:block;
background:#e74c3c;
color:white;
padding:8px;
border-radius:6px;
text-decoration:none;
font-size:14px;
}

.delete-btn:hover{
background:#c0392b;
}

/* زر الرجوع */

.back-btn{
display:inline-block;
margin-top:30px;
padding:10px 15px;
background:#3498db;
color:white;
border-radius:6px;
text-decoration:none;
}

.back-btn:hover{
background:#2980b9;
}

</style>


<div class="container">

<h2 class="page-title">
إدارة أعمال المصمم: {{ designer.username }}
</h2>


<div class="designer-info">

<p><b>البريد:</b> {{ designer.email }}</p>

<p><b>التخصص:</b> {{ designer.specialty }}</p>

</div>


<div class="design-grid">

{% for design in designs %}

<div class="design-card">

<img
src="{{ url_for('static', filename=design.image_path) }}"
class="design-image"
>

<div class="design-body">

<div class="design-title">
{{ design.title }}
</div>

<a
href="{{ url_for('admin.delete_design', design_id=design.id) }}"
class="delete-btn"
onclick="return confirm('هل تريد حذف التصميم؟')"
>
حذف التصميم
</a>

</div>

</div>

{% else %}

<p>لا توجد تصاميم حالياً</p>

{% endfor %}

</div>


<a href="{{ url_for('admin.dashboard_admin') }}" class="back-btn">
العودة للوحة المدير
</a>

</div>

{% endblock %}
